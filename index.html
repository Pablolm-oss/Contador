<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contador">
<meta name="theme-color" content="#f5f7f6">
<title>Contador</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#34443d;--mute:#8a9792;--green:#4cc38a;--red:#ee6b6b;--line:#e8edea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(140px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar{width:56px;height:56px;border-radius:50%;border:5px solid var(--green);display:grid;place-items:center;font-size:24px;background:#eafaf2;flex:none}
header .hi{flex:1;line-height:1.1}
header .hi small{font-size:17px;font-weight:700;color:var(--mute)}
header .hi b{display:block;font-size:28px;font-weight:800;margin-top:2px}
.gear{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(30,50,40,.08);font-size:20px}
h2{font-size:30px;font-weight:800;margin:6px 0 16px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:16px;box-shadow:0 6px 24px rgba(30,50,40,.07)}
.hc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none}
.hc-top .nm{flex:1}
.hc-top .nm b{font-size:19px;display:block}
.hc-top .nm span{font-size:13px;color:var(--mute)}
.slip{padding:9px 13px;border-radius:20px;font-weight:700;font-size:13px;color:var(--red);background:#fdeeee}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:16px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--mute);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#f6f8f7;border-radius:16px;padding:12px}
.stat span{font-size:12px;color:var(--mute);font-weight:600;display:block}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.banner{background:#e6f8ee;display:flex;gap:12px;align-items:center}
.banner p{margin:0;flex:1;font-size:14px;font-weight:600;line-height:1.35}
.btn{background:var(--green);color:#fff;font-weight:800;border-radius:16px;padding:13px 18px;font-size:16px}
.btn.ghost{background:#eef2f0;color:var(--ink)}
.btn.danger{background:#fdeeee;color:var(--red)}
nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:492px;margin:0 auto;z-index:5}
.pill{flex:1;display:flex;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:40px;padding:6px;box-shadow:0 8px 28px rgba(30,50,40,.15)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:34px;font-size:12px;font-weight:700;color:var(--ink)}
.tab i{font-style:normal;font-size:22px;line-height:1}
.tab.on{background:#e3f6ec;color:#2fa56e}
.fab{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 8px 28px rgba(30,50,40,.15);display:grid;place-items:center;flex:none}
.fab span{width:52px;height:52px;border-radius:50%;background:#111;color:#fff;font-size:32px;line-height:50px;text-align:center;font-weight:300}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.chip{border-radius:18px;padding:13px;font-weight:800;font-size:15px;text-align:left;display:flex;gap:8px;align-items:center}
.day-h{font-size:14px;font-weight:800;color:var(--mute);margin:18px 4px 8px;text-transform:capitalize}
.entry{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 12px 12px 0;margin-bottom:8px;box-shadow:0 4px 16px rgba(30,50,40,.06);overflow:hidden}
.entry .bar{width:7px;align-self:stretch;flex:none}
.entry .info{flex:1}
.entry .info b{font-size:16px}
.entry .info span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.entry .tm{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.entry .del{width:30px;height:30px;border-radius:50%;background:#f2f5f3;color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-weight:600}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:19px;text-transform:capitalize}
.cal-head button{width:38px;height:38px;border-radius:50%;background:#f2f5f3;font-size:18px;font-weight:800}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:4px}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:700}
.cell.good{background:var(--green);color:#fff}
.cell.bad{background:var(--red);color:#fff}
.cell.off{color:#c3cbc7}
.cell.future{color:#d4dad7}
.cell.today{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{flex:1}
.ov{position:fixed;inset:0;background:rgba(20,30,25,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:22px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:5px}
.fld input,.fld textarea{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);font-size:16px;font-family:inherit;background:#fafcfb;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}
.sel{outline:3px solid var(--ink);outline-offset:-3px}
.qty{display:flex;align-items:center;gap:18px;justify-content:center;margin:6px 0 14px}
.qty button{width:48px;height:48px;border-radius:50%;background:#eef2f0;font-size:26px;font-weight:700}
.qty b{font-size:34px;min-width:40px;text-align:center}
.hs{border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.hs .t{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:17px}
.hs .t label{margin-left:auto;font-size:13px;color:var(--mute);font-weight:700;display:flex;gap:6px;align-items:center}
textarea{min-height:90px;font-size:12px!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🌱</div>
    <div class="hi"><small>Hola,</small><b id="hdr">Un día a la vez</b></div>
    <button class="gear" data-act="settings" aria-label="Ajustes">⚙️</button>
  </header>
  <main id="view"></main>
</div>
<nav>
  <div class="pill">
    <button class="tab" data-act="tab" data-t="progreso"><i>🏆</i>Progreso</button>
    <button class="tab" data-act="tab" data-t="diario"><i>📖</i>Diario</button>
    <button class="tab" data-act="tab" data-t="stats"><i>📅</i>Estadísticas</button>
  </div>
  <button class="fab" data-act="log" aria-label="Registrar"><span>+</span></button>
</nav>
<div id="ov" class="ov" style="display:none"></div>

<script>
(function(){
'use strict';
var KEY='contador_v1';
var HABITS=[
  {id:'tabaco',name:'Tabaco',emoji:'🚬',color:'#9b7ede',unit:'cigarros',verb:'fumar'},
  {id:'energeticas',name:'Energéticas',emoji:'⚡',color:'#ff9f43',unit:'latas',verb:'tomar'},
  {id:'cerveza',name:'Cerveza',emoji:'🍺',color:'#e8b61c',unit:'cervezas',verb:'beber'},
  {id:'cubata',name:'Cubata',emoji:'🍹',color:'#3fa7d6',unit:'cubatas',verb:'beber'}
];
var H={};HABITS.forEach(function(h){H[h.id]=h;});
var DAY=864e5;

/* ---------- estado ---------- */
var mem=null;
function defaults(){
  var d={tabaco:[24,7.2],energeticas:[2,3],cerveza:[3,6],cubata:[2,16]},s={configured:false,log:[],habits:{}};
  HABITS.forEach(function(h){s.habits[h.id]={active:true,perDay:d[h.id][0],euroDay:d[h.id][1],start:Date.now()};});
  return s;
}
function load(){
  var s=defaults();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);
      if(p&&p.habits){s.configured=!!p.configured;s.log=Array.isArray(p.log)?p.log:[];
        HABITS.forEach(function(h){if(p.habits[h.id])s.habits[h.id]=Object.assign(s.habits[h.id],p.habits[h.id]);});}}
  }catch(e){}
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();save();

/* ---------- utilidades ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function startOfDay(ts){var d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function dur(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};}
function short(ms){var t=dur(ms);if(t.d>0)return t.d+'d '+t.h+'h';if(t.h>0)return t.h+'h '+t.m+'m';return t.m+'m '+t.s+'s';}
function money(n){return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function timeStr(ts){return new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});}
function active(){return HABITS.filter(function(h){return S.habits[h.id].active;});}
function logsOf(id){return S.log.filter(function(l){return l.h===id;});}

function stats(id,now){
  var c=S.habits[id],ls=logsOf(id).filter(function(l){return l.ts>=c.start&&l.ts<=now;});
  var last=ls.reduce(function(a,l){return Math.max(a,l.ts);},0);
  var base=Math.max(c.start,last);
  var consumed=ls.reduce(function(a,l){return a+(l.qty||1);},0);
  var unit=c.perDay>0?c.euroDay/c.perDay:0;
  var spent=ls.reduce(function(a,l){return a+(typeof l.cost==='number'?l.cost:(l.qty||1)*unit);},0);
  var saved=Math.max(0,(now-c.start)/DAY*c.perDay-consumed);
  var mon=Math.max(0,(now-c.start)/DAY*c.euroDay-spent);
  return {since:now-base,saved:Math.floor(saved),money:mon,consumed:consumed,spent:spent};
}
function totals(now){
  var act=active(),m=0,earliest=Infinity,last=0;
  act.forEach(function(h){
    var c=S.habits[h.id];m+=stats(h.id,now).money;earliest=Math.min(earliest,c.start);
    logsOf(h.id).forEach(function(l){if(l.ts>=c.start&&l.ts<=now)last=Math.max(last,l.ts);});
  });
  if(!act.length)return {money:0,since:0};
  return {money:m,since:now-Math.max(earliest,last)};
}

/* ---------- vistas ---------- */
var tab='progreso',cal=(function(){var d=new Date();return {y:d.getFullYear(),m:d.getMonth()};})();
var view=document.getElementById('view');

function tiles(prefix,color){
  var l=[['d','días'],['h','horas'],['m','min'],['s','seg']];
  return '<div class="tiles">'+l.map(function(x){
    return '<div class="tile" style="background:'+color+'1f"><b data-k="'+prefix+':'+x[0]+'">0</b><span>'+x[1]+'</span></div>';}).join('')+'</div>';
}
function renderProgress(){
  var h='<h2>Mi progreso</h2>';
  if(!S.configured)h+='<div class="card banner"><span style="font-size:28px">👋</span><p>Ajusta tu media diaria, tu gasto y cuándo empezaste en cada reto.</p><button class="btn" data-act="settings">Ajustar</button></div>';
  var act=active();
  if(!act.length)h+='<div class="empty">No hay retos activos.<br>Actívalos en ⚙️ Ajustes.</div>';
  act.forEach(function(x){
    h+='<div class="card"><div class="hc-top"><div class="badge" style="background:'+x.color+'22">'+x.emoji+'</div>'
      +'<div class="nm"><b>'+x.name+'</b><span>Tiempo desde el último</span></div>'
      +'<button class="slip" data-act="log" data-h="'+x.id+'">Ha caído</button></div>'
      +tiles(x.id,x.color)
      +'<div class="stats"><div class="stat"><span>'+x.unit.charAt(0).toUpperCase()+x.unit.slice(1)+' ahorrados</span><b data-k="'+x.id+':saved">0</b></div>'
      +'<div class="stat"><span>Dinero ahorrado</span><b data-k="'+x.id+':money">0,00 €</b></div></div></div>';
  });
  view.innerHTML=h;
}
function renderDiary(){
  var h='<h2>Diario</h2><div class="chips">';
  active().forEach(function(x){h+='<button class="chip" data-act="log" data-h="'+x.id+'" style="background:'+x.color+'22;color:'+x.color+'"><span style="font-size:20px">'+x.emoji+'</span>'+x.name+'</button>';});
  h+='</div>';
  var ls=S.log.slice().sort(function(a,b){return b.ts-a.ts;});
  if(!ls.length)h+='<div class="empty">Aún no hay caídas registradas.<br>¡Así se empieza! 💪</div>';
  var cur='',today=dayKey(Date.now()),yest=dayKey(Date.now()-DAY);
  ls.forEach(function(l){
    var x=H[l.h];if(!x)return;
    var k=dayKey(l.ts);
    if(k!==cur){cur=k;h+='<div class="day-h">'+(k===today?'Hoy':k===yest?'Ayer':new Date(l.ts).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))+'</div>';}
    var c=S.habits[l.h],prev=c.start;
    S.log.forEach(function(o){if(o.h===l.h&&o.ts<l.ts&&o.ts>=c.start)prev=Math.max(prev,o.ts);});
    var held=l.ts-prev;
    h+='<div class="entry"><div class="bar" style="background:'+x.color+'"></div><div class="info"><b>'+x.emoji+' '+x.name+(l.qty>1?' ×'+l.qty:'')+'</b>'
      +'<span>'+(typeof l.cost==='number'?money(l.cost)+(held>0?' · ':''):'')+(held>0?'Aguantaste '+short(held):'')+'</span></div><div class="tm">'+timeStr(l.ts)+'</div>'
      +'<button class="del" data-act="del" data-id="'+l.id+'" aria-label="Borrar">✕</button></div>';
  });
  view.innerHTML=h;
}
function renderStats(){
  var now=Date.now(),act=active();
  var minStart=act.length?Math.min.apply(null,act.map(function(x){return S.habits[x.id].start;})):now;
  var from=startOfDay(minStart),todayS=startOfDay(now);
  var slips={};
  S.log.forEach(function(l){if(S.habits[l.h]&&S.habits[l.h].active)slips[dayKey(l.ts)]=1;});
  var y=cal.y,m=cal.m,first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  var good=0,bad=0,cells='';
  for(var i=0;i<off;i++)cells+='<div></div>';
  for(var d=1;d<=n;d++){
    var t=new Date(y,m,d).getTime(),cls;
    if(t<from)cls='off';else if(t>todayS)cls='future';else if(slips[dayKey(t)]){cls='bad';bad++;}else{cls='good';good++;}
    if(t===todayS)cls+=' today';
    cells+='<div class="cell '+cls+'">'+d+'</div>';
  }
  var h='<h2>Estadísticas</h2><div class="card"><div class="cal-head"><button data-act="prev">‹</button><b>'
    +first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})+'</b><button data-act="next">›</button></div>'
    +'<div class="dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="grid">'+cells+'</div>'
    +'<div class="legend"><span><i style="background:var(--green)"></i>Superado: '+good+'</span><span><i style="background:var(--red)"></i>Caída: '+bad+'</span></div></div>';
  h+='<div class="card"><div class="lbl">🌿 Sin adicciones</div><div class="big" data-k="all:since">0d 0h 0m 0s</div>'
    +'<div style="font-size:12.5px;color:var(--mute);margin-top:4px;font-weight:600">Tiempo sin apuntar ninguna caída</div></div>';
  h+='<div class="card"><div class="lbl">💰 Dinero total</div><div class="big" data-k="all:money">0,00 €</div><div style="margin-top:8px">';
  act.forEach(function(x){h+='<div class="row"><span style="font-size:20px">'+x.emoji+'</span><b>'+x.name+'</b><span data-k="'+x.id+':money" style="font-weight:800">0,00 €</span></div>';});
  h+='</div></div>';
  view.innerHTML=h;
}
function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab);});
  if(tab==='progreso')renderProgress();else if(tab==='diario')renderDiary();else renderStats();
  tick();window.scrollTo(0,0);
}
function tick(){
  var now=Date.now(),cache={};
  document.querySelectorAll('[data-k]').forEach(function(el){
    var p=el.dataset.k.split(':'),id=p[0],k=p[1],v;
    if(id==='all'){cache.all=cache.all||totals(now);
      v=k==='money'?money(cache.all.money):(function(){var t=dur(cache.all.since);return t.d+'d '+t.h+'h '+t.m+'m '+t.s+'s';})();
    }else{
      cache[id]=cache[id]||stats(id,now);var st=cache[id];
      if(k==='saved')v=st.saved;else if(k==='money')v=money(st.money);else v=dur(st.since)[k];
    }
    if(el.textContent!==String(v))el.textContent=v;
  });
}

/* ---------- hojas modales ---------- */
var ov=document.getElementById('ov'),draft={};
function openSheet(html){ov.innerHTML='<div class="sheet">'+html+'</div>';ov.style.display='flex';}
function closeSheet(){ov.style.display='none';ov.innerHTML='';}
ov.addEventListener('click',function(e){if(e.target===ov)closeSheet();});

function openLog(pre){
  var act=active();if(!act.length){openSettings();return;}
  draft={};act.forEach(function(x){draft[x.id]=x.id===pre?1:0;});
  var h='<h3>¿Qué ha pasado?</h3><div style="font-size:13px;color:var(--mute);font-weight:600;margin:-6px 0 12px;line-height:1.35">Pon cuántos has consumido y cuánto te ha costado en total (0 si te invitaron). Si dejas el gasto vacío se usa tu precio habitual.</div>';
  act.forEach(function(x){
    var c=S.habits[x.id],u=c.perDay>0?c.euroDay/c.perDay:0;
    h+='<div class="hs'+(draft[x.id]>0?' sel':'')+'" id="r-'+x.id+'"><div class="t"><span>'+x.emoji+'</span>'+x.name+'</div>'
      +'<div class="two" style="align-items:end"><div class="qty" style="margin:0;gap:10px;justify-content:flex-start"><button data-act="qm" data-h="'+x.id+'">−</button><b id="q-'+x.id+'" style="font-size:28px;min-width:30px">'+draft[x.id]+'</b><button data-act="qp" data-h="'+x.id+'">+</button></div>'
      +'<div class="fld" style="margin:0"><label>Gastado (€)</label><input type="text" inputmode="decimal" id="c-'+x.id+'" placeholder="'+(u?u.toFixed(2).replace('.',','):'0')+'"></div></div></div>';
  });
  h+=''
    +'<div class="fld"><label>Cuándo</label><input type="datetime-local" id="lts" value="'+toLocalInput(Date.now())+'" max="'+toLocalInput(Date.now())+'"></div>'
    +'<div style="font-size:12.5px;color:var(--mute);margin-bottom:10px;font-weight:600">El contador de cada reto registrado volverá a 0 y se descontará lo consumido y lo gastado.</div>'
    +'<div class="acts"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" style="background:var(--red)" data-act="savelog">Registrar</button></div>';
  openSheet(h);
}
function openSettings(){
  var h='<h3>Ajustes</h3>';
  HABITS.forEach(function(x){
    var c=S.habits[x.id];
    h+='<div class="hs"><div class="t"><span>'+x.emoji+'</span>'+x.name+'<label><input type="checkbox" id="a-'+x.id+'" '+(c.active?'checked':'')+'> Activo</label></div>'
      +'<div class="two"><div class="fld"><label>Media diaria ('+x.unit+')</label><input type="number" inputmode="decimal" step="any" min="0" id="p-'+x.id+'" value="'+c.perDay+'"></div>'
      +'<div class="fld"><label>Gasto diario (€)</label><input type="number" inputmode="decimal" step="any" min="0" id="e-'+x.id+'" value="'+c.euroDay+'"></div></div>'
      +'<div class="fld" style="margin:0"><label>Empecé a dejarlo</label><input type="datetime-local" id="s-'+x.id+'" value="'+toLocalInput(c.start)+'"></div></div>';
  });
  h+='<div class="acts"><button class="btn ghost" data-act="close">Cerrar</button><button class="btn" data-act="savesettings">Guardar</button></div>'
    +'<div class="fld" style="margin-top:22px"><label>Copia de seguridad (copia este texto y guárdalo; para restaurar, pégalo aquí)</label><textarea id="bk">'+esc(JSON.stringify(S))+'</textarea></div>'
    +'<div class="acts"><button class="btn ghost" data-act="copy">Copiar</button><button class="btn ghost" data-act="restore">Restaurar</button></div>'
    +'<div class="acts"><button class="btn danger" data-act="reset">Borrar todos los datos</button></div>';
  openSheet(h);
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='tab'){tab=el.dataset.t;render();}
  else if(a==='log')openLog(el.dataset.h);
  else if(a==='settings')openSettings();
  else if(a==='close')closeSheet();
  else if(a==='qm'||a==='qp'){
    var id=el.dataset.h;draft[id]=Math.max(0,Math.min(99,(draft[id]||0)+(a==='qp'?1:-1)));
    document.getElementById('q-'+id).textContent=draft[id];
    document.getElementById('r-'+id).classList.toggle('sel',draft[id]>0);
  }
  else if(a==='savelog'){
    var v=document.getElementById('lts').value,ts=v?new Date(v).getTime():Date.now(),any=false;
    if(isNaN(ts)||ts>Date.now())ts=Date.now();
    active().forEach(function(x){
      var q=draft[x.id]||0;if(q<1)return;
      var cost=parseFloat(document.getElementById('c-'+x.id).value.trim().replace(',','.'));
      if(isNaN(cost)||cost<0){var c=S.habits[x.id];cost=(c.perDay>0?c.euroDay/c.perDay:0)*q;}
      S.log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)+x.id,h:x.id,ts:ts,qty:q,cost:Math.round(cost*100)/100});
      any=true;
    });
    if(!any){alert('Pon al menos una cantidad mayor que 0.');return;}
    save();closeSheet();render();
  }
  else if(a==='del'){if(confirm('¿Borrar este registro?')){S.log=S.log.filter(function(l){return l.id!==el.dataset.id;});save();render();}}
  else if(a==='prev'){cal.m--;if(cal.m<0){cal.m=11;cal.y--;}render();}
  else if(a==='next'){cal.m++;if(cal.m>11){cal.m=0;cal.y++;}render();}
  else if(a==='savesettings'){
    HABITS.forEach(function(x){
      var c=S.habits[x.id],p=parseFloat(document.getElementById('p-'+x.id).value),eu=parseFloat(document.getElementById('e-'+x.id).value),
          st=new Date(document.getElementById('s-'+x.id).value).getTime();
      c.active=document.getElementById('a-'+x.id).checked;
      c.perDay=isNaN(p)||p<0?0:p;c.euroDay=isNaN(eu)||eu<0?0:eu;
      if(!isNaN(st))c.start=Math.min(st,Date.now());
    });
    S.configured=true;save();closeSheet();render();
  }
  else if(a==='copy'){
    var t=document.getElementById('bk');t.select();t.setSelectionRange(0,999999);
    try{if(navigator.clipboard)navigator.clipboard.writeText(t.value);else document.execCommand('copy');}catch(x){try{document.execCommand('copy');}catch(y){}}
    el.textContent='¡Copiado!';
  }
  else if(a==='restore'){
    try{
      var p=JSON.parse(document.getElementById('bk').value);
      if(!p||!p.habits||!Array.isArray(p.log))throw 0;
      if(!confirm('Esto reemplazará tus datos actuales. ¿Continuar?'))return;
      S=Object.assign(defaults(),p);save();closeSheet();render();
    }catch(x){alert('El texto no es una copia de seguridad válida.');}
  }
  else if(a==='reset'){
    if(confirm('¿Borrar TODOS los datos? No se puede deshacer.')){S=defaults();save();closeSheet();render();}
  }
});

/* ---------- icono para la pantalla de inicio ---------- */
try{
  var cv=document.createElement('canvas');cv.width=cv.height=180;var cx=cv.getContext('2d');
  var g=cx.createLinearGradient(0,0,180,180);g.addColorStop(0,'#6fdca8');g.addColorStop(1,'#2fa56e');
  cx.fillStyle=g;cx.fillRect(0,0,180,180);cx.font='96px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🌱',90,98);
  var lk=document.createElement('link');lk.rel='apple-touch-icon';lk.href=cv.toDataURL('image/png');document.head.appendChild(lk);
}catch(e){}

render();
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
